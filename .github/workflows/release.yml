name: Release

on:
  release:
    types: [published]

permissions:
  contents: write
  
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: swift-actions/setup-swift@v2
        with:
          swift-version: "6.1"

      - name: Build
        run: swift build -c release --arch arm64

      - name: Package
        run: |
          mkdir -p dist
          cp .build/release/ragmac dist/
          tar -czf ragmac.tar.gz -C dist ragmac

      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ github.event.release.tag_name }}" ragmac.tar.gz
